name: CI and deploy

# The test job runs on every pull request targeting main and on every push
# to main.
#
# There is deliberately no "make this a required status check" instruction
# here: the Lychee-Home org is on GitHub Free and this repo is private, a
# combination for which both branch protection and rulesets are unavailable
# (their APIs return 403, "Upgrade to GitHub Pro or make this repository
# public"). So nothing mechanically prevents merging a PR whose test run is
# red — that part is down to reading the check before clicking merge.
#
# What is enforced without any repo settings: deploy has `needs: test`, and
# that applies to pushes on main just as much as to pull requests. Merging a
# red PR therefore leaves main red and the deploy skipped — broken code
# never reaches lychee, and the host keeps serving the last good deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Runs on a GitHub-hosted runner, not the self-hosted one: these checks
  # need only npm, and an ephemeral VM means pull-request code never
  # executes on lychee, where github-runner holds sudo rights.
  test:
    runs-on: ubuntu-latest

    # Cancel superseded runs on a pull request, so pushing three commits
    # leaves only the newest run. Deliberately does NOT cancel on main:
    # the deploy job needs this one, so a cancelled test run would take
    # its deploy with it and leave that merge silently undeployed. That
    # holds for two merges arriving close together; the same one-pending-
    # entry-per-group queue behavior as the deploy job's group means a
    # third merge in quick succession can still cancel the middle one's
    # (queued, not yet started) test run.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    # needs: test is the real gate — Actions will not start this job unless
    # the checks passed, so a failing suite cannot reach lychee even on a
    # direct push to main. The `if` adds two more independent conditions:
    # it keeps this off pull requests while still allowing workflow_dispatch
    # (which runs both jobs and is gated too), and it restricts that
    # dispatch to the main ref — workflow_dispatch can otherwise be run
    # against any branch, which would rsync that branch onto the host.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 15

    # One group for every deploy, so two merges queue rather than overlap.
    # Never cancelled once running, unlike the test job: interrupting a
    # deploy could stop rsync --delete partway through, leaving
    # /opt/lyly-admin half-synced, or land between the sync and the service
    # restart. This only protects a run that has started — the concurrency
    # queue still holds just one pending entry per group, so if a third
    # deploy arrives while one is running and another is already queued,
    # the previously queued (not yet started) one is cancelled and its
    # merge does not get deployed on its own.
    concurrency:
      group: deploy-lychee
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Installs dev dependencies as well, because npm run build needs tsc
      # and tailwindcss. Unrelated to the --omit=dev install further down,
      # which runs inside /opt/lyly-admin and installs only what the
      # running service needs. typecheck and test are not repeated here —
      # they ran in the test job, and needs: guarantees they passed.
      - run: npm ci
      - run: npm run build

      # Sync everything except secrets and dev artifacts. .env lives only on
      # the host (/opt/lyly-admin/.env) and is never written by CI.
      #
      # Deliberately not using -a: /opt/lyly-admin is pre-created and owned
      # by lyly-admin, not github-runner, so preserving perms/owner/group/
      # times on that existing directory fails even though github-runner (a
      # webdeploy group member) can write inside it fine. None of those
      # attributes matter for how this app runs, so just recurse, keep
      # symlinks as symlinks, and preserve file (not directory) content —
      # new files get the setgid dir's webdeploy group and default perms.
      - name: Sync app files
        run: |
          rsync -rl --delete \
            --exclude='.git' --exclude='.env' --exclude='node_modules' \
            --exclude='src/dev' --exclude='*.test.ts' \
            ./ /opt/lyly-admin/

      - name: Install production dependencies
        run: cd /opt/lyly-admin && npm ci --omit=dev

      - name: Restart service
        run: sudo systemctl restart lyly-admin

      - name: Verify service is active
        run: |
          sleep 2
          sudo systemctl is-active lyly-admin

      # is-active only proves systemd thinks the process is running — it
      # doesn't prove Express actually bound its port and is answering
      # requests. A 401 here (unauthenticated) is the real proof: it means
      # the server accepted the connection and basic-auth middleware ran.
      - name: Health check
        run: |
          set -a
          . /opt/lyly-admin/.env
          set +a
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://${HOST:-127.0.0.1}:${PORT:-8787}/")
          if [ "$code" != "401" ]; then
            echo "Unexpected health check status: $code (expected 401)" >&2
            exit 1
          fi
          echo "Health check OK — got 401 as expected"
