name: CI

# Runs on every pull request against main and every push to main, always on
# a GitHub-hosted runner. Deployment is not performed here: lychee pulls
# the image the `release` job signs, via LycheeHome/lychee-ops. That split is what
# lets this repo be public — a fork PR supplies its own workflow file, so a
# self-hosted runner reachable from here would be a remote code execution
# path onto the host.
#
# Every action is pinned to a full commit SHA, with its release in a comment.
# A tag can be moved; a SHA cannot. That matters here because lychee installs
# whatever the `release` job signs: any action that job runs can shape the
# image the attestation vouches for, so the provenance check is only as strong
# as these pins. Bump one by resolving the new release tag to its commit and
# replacing both the SHA and the comment (src/lib/contractAgreements.test.ts
# fails on an unpinned `uses:`).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Name is load-bearing: lychee-ops gates its deploy on an Actions JOB
  # named exactly "test" for the target commit, via
  # /actions/runs/{id}/jobs. Renaming this key — or giving it a `name:`
  # override, which replaces the job name the API reports — silently stops
  # every deploy, reporting "job test concluded: missing", which reads like
  # CI never ran.
  test:
    runs-on: ubuntu-latest

    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -r .contract/requirements.txt
      - run: npm run test:contract
      - run: npm run build

  # Name is load-bearing (agreement A-CI-2): lychee-ops looks for an Actions
  # JOB named exactly "release" on the target commit, and finds the image by
  # the sha-<commit> tag this job pushes. Renaming the key, or giving it a
  # `name:` override, which replaces the job name the API reports, silently
  # stops every deploy. It runs only on pushes to main and only after `test`
  # passes, so no pull request ever gets a token that can write packages.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: scripts/assemble-release.sh release

      # Older glibc than the runner's, because the host's is older too.
      - run: >-
          docker run --rm
          -v "$PWD/release:/app:ro"
          -v "$PWD/scripts/smoke-release.cjs:/smoke.cjs:ro"
          node:22-bookworm-slim node /smoke.cjs /app

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: release.Dockerfile
          context: .
          platforms: linux/amd64
          push: true
          # buildx's own unsigned provenance would turn the tag into an image
          # index with an extra attestation manifest. The signed provenance
          # comes from attest-build-provenance below, and the host expects a
          # single linux/amd64 manifest.
          provenance: false
          sbom: false
          tags: ghcr.io/lycheehome/lychee-admin:sha-${{ github.sha }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/lycheehome/lychee-admin
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
